name: Repository governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-and-branch-policy:
    name: Markdown integrity and branch routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Markdown and pull-request routing
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python scripts/check_repository_governance.py \
            --base "$PR_BASE" \
            --head "$PR_HEAD" \
            --body "$PR_BODY"
      - name: Validate Markdown on manual run
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_repository_governance.py
