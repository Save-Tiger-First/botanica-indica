name: Repository governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-and-branch-policy:
    name: Markdown integrity and branch routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1; full verified commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # actions/setup-python v7.1.0; full verified commit SHA.
        # Both selected action releases use Node.js 24.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Validate Markdown and pull-request routing
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python scripts/check_repository_governance.py \
            --base "$PR_BASE" \
            --head "$PR_HEAD" \
            --body "$PR_BODY" \
            --number "$PR_NUMBER"
      - name: Validate Markdown on manual run
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_repository_governance.py
